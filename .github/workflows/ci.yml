name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check architecture boundaries
        run: python scripts/check_architecture.py
      - name: Run unit and fixture tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q backend tests scripts
      - name: Smoke read-only diagnostics CLI
        env:
          PYTHONPATH: backend
        run: python -m hdm.cli --compact
