name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check architecture boundaries
        run: python scripts/check_architecture.py
      - name: Run unit and fixture tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q backend tests scripts
      - name: Smoke read-only diagnostics CLI
        env:
          PYTHONPATH: backend
        run: python -m hdm.cli --compact
      - name: Type-check Decky UI
        run: pnpm typecheck
      - name: Test Steam sleep preflight
        run: pnpm test:frontend
      - name: Check live preflight probe
        run: node --check scripts/probe_steam_suspend_store.mjs
      - name: Build Decky UI
        run: pnpm build
      - name: Check Decky package contract
        run: python scripts/check_plugin_package.py .
      - name: Build Decky archive
        run: python scripts/build_plugin.py
